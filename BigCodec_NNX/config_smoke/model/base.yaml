codec_encoder:
  type: 'conformer_stft'
  hop_length: 160 #256
  n_fft: 640 #1024
  window_size: 640 #1024
  dim: 512
  n_layers_stage0: 5
  n_layers_stage1: 5
  r: 0.5
  n_head: 8
  ffn_mult: 4
  conv_kernel_size: 31
  dropout: 0.1
  original_max_position_embeddings: 400
  max_position_embeddings: 8192
  base: 10000
  causal: False
  out_channels: 512

codec_decoder:
  type: 'conformer_istft'
  in_channels: 512
  hop_length: 160 #256
  n_fft: 640 #1024
  window_size: 640 #1024
  dim: 512
  n_layers_stage0: 0
  n_layers_stage1: 5
  r: 0.5
  n_head: 8
  ffn_mult: 4
  conv_kernel_size: 31
  dropout: 0.1
  original_max_position_embeddings: 400
  max_position_embeddings: 8192
  base: 10000
  causal: False
  vq_num_quantizers: 1 # 8
  vq_commit_weight: 0.25
  vq_weight_init: False
  fsq: False
  fsq_levels: [4,4,4,4,4,4,4,4]
  vq_full_commit_loss: False
  codebook_size: 65536 # 1024
  codebook_dim: 8

tome:
  use_tome: False
  class_name: 'ToMeK2New'
  tome_params:
    num_iterations: 8
    r: 0.5
  proj: True
  proj_dim: 512

mpd:
  periods: [2, 3, 5, 7, 11]
  max_downsample_channels: 512
  channels: 16
  channel_increasing_factor: 4

mstft:
  stft_params:
    fft_sizes: [128, 256, 512, 1024, 2048]
    hop_sizes: [32, 64, 128, 256, 512]
    win_lengths: [128, 256, 512, 1024, 2048]
    window: hann_window
  in_channels: 1
  out_channels: 1
  kernel_sizes: [5, 3]
  channels: 32
  max_downsample_channels: 512
  downsample_scales: [2, 2, 2]
  use_weight_norm: True
