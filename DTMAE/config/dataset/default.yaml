dataset:
  _target_: data_module.FSDataset

train:
  filelist: ./filelists/librispeech_train_all.txt
  batch_size: 64
  shuffle: true
  min_audio_length: 64000

val:
  filelist: ./filelists/librispeech_test_clean.txt
  batch_size: 64
  shuffle: false
  min_audio_length: 64000
  log_idxs: [0,1,2,3]

test:
  filelist: ./filelists/librispeech_test_clean.txt
  batch_size: 1
  shuffle: false
  min_audio_length: -1
  log_idxs: [0,1,2,3]

sample_rate: 16000
multiple_of: 320
bow:
  enable: true
  label_path: null            # optional override; meta_path covers splits
  vocab_path: ./filelists/bow/vocab.json
  meta_path: ./filelists/bow/bow_meta.json
  vocab_size: 512
