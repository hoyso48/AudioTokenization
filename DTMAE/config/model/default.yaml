codec_encoder:
  hop_length: 80 #256
  n_fft: 320 #1024
  window_size: 320 #1024
  dim: 512
  n_layers_level1: 6
  n_layers_level2: 12
  r: 0.5
  n_head: 4
  ffn_mult: 4
  dropout: 0
  max_position_embeddings: 8192
  base: 10000
  causal: False
  out_channels: 512
  norm_eps: 1e-2
  attn_window_size: [64, 64]

codec_decoder:
  in_channels: 512
  hop_length: 80 #256
  n_fft: 320 #1024
  window_size: 320 #1024
  dim: 512
  n_layers_level1: 6
  n_layers_level2: 12
  r: 0.5
  n_head: 4
  ffn_mult: 4
  dropout: 0
  max_position_embeddings: 8192
  base: 10000
  causal: False
  norm_eps: 1e-2
  attn_window_size: [64, 64]
  # Legacy quantizer params (kept for reference, use quantizer section instead):
  # vq_num_quantizers: 1
  # vq_commit_weight: 0.5
  # vq_weight_init: False
  # fsq: False
  # fsq_levels: [8,8,8,5,5,5]
  # vq_full_commit_loss: False
  # codebook_size: 16384
  # codebook_dim: 8

# =============================================================================
# Resampler / DTP config (used by `CodecLightningModule`)
# =============================================================================
resampler:
  use_dtp: True
  dtp_cls: PLEBatchTopK
  dtp_params:
    r: 0.5
    initial_tau: 1.0
    ema_mu: 0.95
    eta0: 0.1
    decay_T: 1000.0
    tau_min: 1e-6
    tau_max: 1e6
    update_every: 1
    max_s: null
    sample_prob: 0
    min_mask_span: 1
    max_mask_span: 1
    min_mask_prob: 0.5
    max_mask_prob: 0.5
  downsampler_cls: FrontierDownsampler
  downsampler_params: {}
  upsampler_cls: MaskUpsampler
  upsampler_params:
    dim: 512
  # Optional: add a learned embedding based on each token's span length derived from `mask`.
  # This behaves like learned absolute positional encodings, but the id is "segment length".
  length_embedding:
    enable: false
    max_len: 512
    init_std: 0.02
    scale: 1.0
    
# =============================================================================
# Quantizer config (extensible pattern like resampler)
# Available quantizers: ResidualVQ, DitheredFSQ, FSQ, SimVQ
# =============================================================================
quantizer:
  cls: ResidualVQ
  params:
    dim: 512
    codebook_size: 16384
    codebook_dim: 8
    num_quantizers: 1
    commitment: 0.5

# =============================================================================
# DitheredFSQ Config (from TAAE paper)
# =============================================================================
# Auto-switches based on mode: train() vs eval()
#
# quantizer:
#   cls: DitheredFSQ
#   params:
#     dim: 256
#     codebook_dim: 6
#     # --- Training (model.train()) ---
#     train_levels: [17, 9, 5]
#     train_num_residuals: 1
#     noise_dropout: 0.5
#     # --- Inference (model.eval()) ---
#     inference_levels: [5, 5, 5, 5, 5, 5]
#     inference_num_residuals: 2
#     # --- Common ---
#     num_codebooks: 1
#     scale: 1.0
#
# BPS @25Hz (auto-applied on eval()):
#   400bps: inference_levels=[6,6,6,6,6,6], inference_num_residuals=1
#   700bps: inference_levels=[5,5,5,5,5,5], inference_num_residuals=2
#   350bps: inference_levels=[5,5,5,5,5,5], inference_num_residuals=1
# =============================================================================

mpd:
  periods: [2, 3, 5, 7, 11]
  max_downsample_channels: 256
  channels: 8
  channel_increasing_factor: 4
  use_weight_norm: False

mstft:
  stft_params:
    fft_sizes: [78, 126, 206, 334, 542, 876, 1418, 2296]
    hop_sizes: [39, 63, 103, 167, 271, 438, 709, 1148]
    win_lengths: [78, 126, 206, 334, 542, 876, 1418, 2296]
    window: hann_window
  in_channels: 1
  out_channels: 1
  kernel_sizes: [5, 3]
  channels: 8
  max_downsample_channels: 256
  downsample_scales: [2, 2, 2]
  use_weight_norm: False


